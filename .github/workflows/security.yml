name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci*'
      - 'Makefile'
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC — weekly baseline
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: praetorian-inc/public-workflows/.github/workflows/go-sec.yml@c5f6f98f1faf8f9ac6a870eced139b2509e08bfc  # v2.12.1
    permissions:
      contents: read
      security-events: write
      actions: read           # required by codeql-action/upload-sarif for run metadata
    with:
      gosec-version: "v2.28.0"
      govulncheck-version: "v1.7.0"
    secrets: inherit
