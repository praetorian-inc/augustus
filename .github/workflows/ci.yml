name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: praetorian-inc/public-workflows/.github/workflows/go-ci.yml@56eb1be4ae704e15e29beca8f1bb611bde8f99ce  # v1.0.0
    permissions:
      contents: read
    with:
      build-cmd-path: ./cmd/augustus
      build-binary-name: augustus
    secrets: inherit
