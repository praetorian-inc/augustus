name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: praetorian-inc/public-workflows/.github/workflows/go-ci.yml@d805693c16ea002e098e5520592959a8e98e12ac  # v1.1.0
    permissions:
      contents: read
    with:
      build-cmd-path: ./cmd/augustus
      build-binary-name: augustus
      golangci-lint-only-new-issues: true
    secrets: inherit
