name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    uses: praetorian-inc/public-workflows/.github/workflows/go-release.yml@f2c1dd0  # v3.0.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      release-mode: auto-tag-from-main
