name: Gemini PR Assistant

on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: gemini-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # stray review comments must not cancel an in-progress review

jobs:
  gemini-review:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event_name != 'pull_request_review_comment' || contains(github.event.comment.body, '@gemini'))
    uses: praetorian-inc/public-workflows/.github/workflows/gemini-code.yml@8c7df4ce3c6b5bbf4ef9e3f1df0e4f6a5d3643e5  # v2.9.1
    permissions:
      contents: read
      pull-requests: write
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}