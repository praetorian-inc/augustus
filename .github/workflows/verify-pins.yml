name: Verify Pins
# Fails CI if any first-party praetorian-inc/public-workflows `uses:` pin carries a
# dishonest version comment (missing tag, nonexistent tag, or SHA != that tag).
on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**']
permissions:
  contents: read
jobs:
  verify:
    uses: praetorian-inc/public-workflows/.github/workflows/verify-pins.yml@fc299086c95ccce7bd9046e158b029dfb5815e2f  # v2.9.2
    permissions:
      contents: read
