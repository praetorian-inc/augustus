name: Verify Pins
# Fails CI if any first-party praetorian-inc/public-workflows `uses:` pin carries a
# dishonest version comment (missing tag, nonexistent tag, or SHA != that tag).
on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**']
permissions:
  contents: read
jobs:
  verify:
    uses: praetorian-inc/public-workflows/.github/workflows/verify-pins.yml@fe82661912c4569ea4662e32cada87603795cab9  # v2.21.22
    permissions:
      contents: read
