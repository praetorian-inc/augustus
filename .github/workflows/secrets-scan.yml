name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # weekly baseline
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: praetorian-inc/public-workflows/.github/workflows/titus-scan.yml@1a91334ad83c70d8a1e8375a925c9b5cd69fb6ec  # v2.18.2
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      fail-on-findings: true

