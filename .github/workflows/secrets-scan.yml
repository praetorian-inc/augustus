name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # weekly baseline
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: praetorian-inc/public-workflows/.github/workflows/titus-scan.yml@4d159292c689b4ea95f01ca1d9d6f891c123eeb2  # v2.11.0
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      fail-on-findings: true

