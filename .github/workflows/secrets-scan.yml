name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # weekly baseline
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: praetorian-inc/public-workflows/.github/workflows/titus-scan.yml@81b380c4c98d06fc2a2d69ba5b1a674056b04f3d  # v2.13.1
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      fail-on-findings: true

