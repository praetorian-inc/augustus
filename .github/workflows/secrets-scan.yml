name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # weekly baseline
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: praetorian-inc/public-workflows/.github/workflows/titus-scan.yml@db3874dac21999c2f079a70ab6ae1e6206353785  # v2.16.12
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      fail-on-findings: true

