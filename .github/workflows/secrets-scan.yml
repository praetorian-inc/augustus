name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # weekly baseline
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: praetorian-inc/public-workflows/.github/workflows/titus-scan.yml@bcc4e1bef0ebb6768945d04601aa777eae6ab7c4  # v2.17.1
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      fail-on-findings: true

