name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # weekly baseline
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: praetorian-inc/public-workflows/.github/workflows/titus-scan.yml@fc299086c95ccce7bd9046e158b029dfb5815e2f  # v2.9.2
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    with:
      fail-on-findings: true

